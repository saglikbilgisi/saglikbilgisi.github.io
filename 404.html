<script>
// Hangi gün açıldı: #g2026-11-11 ya da /g/2026-11-11
var ARSIV="https://claude.ai/artifact/1nBiKfLmZCJ2h6hFXCnw5k";
var m=location.hash.match(/^#g(\d{4}-\d{2}-\d{2})$/)||location.pathname.match(/^\/g\/(\d{4}-\d{2}-\d{2})\/?$/);
var GUN=m?m[1]:"";
var HEDEF=ARSIV+(GUN?"#g"+GUN:"");
// Sayaç her günü ayrı sayfa olarak saysın
try{ if(GUN && location.pathname!=="/g/"+GUN) history.replaceState(null,"","/g/"+GUN); }catch(e){}
var gitti=false;
function git(){ if(gitti) return; gitti=true; location.replace(HEDEF); }
addEventListener("load",function(){ setTimeout(git,900); });
setTimeout(git,3500);
</script>
